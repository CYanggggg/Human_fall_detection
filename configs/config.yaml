detection:
  model_size: "medium"       # nano/small/medium/large/xlarge
  confidence_threshold: 0.5
  iou_threshold: 0.45
  person_class_id: 0
  input_size: 640

tracking:
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30
  match_thresh: 0.8

pose:
  model_complexity: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  num_keypoints: 33
  total_features: 99

classification:
  num_classes: 2             # fall / no-fall
  sequence_length: 36        # ~1.2 sec at 30fps (matches reference project)
  lstm_hidden: 48            # matches reference LSTM size
  lstm_layers: 2
  dropout: 0.1
  num_physics_features: 5    # ratio_bbox, log_angle, re, ratio_deriv, gf
  fall_consec_frames: 9      # consecutive fall predictions before confirming

visualisation:
  bbox_thickness: 2
  font_scale: 0.6
  fall_color: [0, 0, 255]    # Red BGR
  normal_color: [0, 200, 0]  # Green BGR
  warning_color: [0, 165, 255] # Orange BGR
